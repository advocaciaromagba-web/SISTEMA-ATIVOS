<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Distribuição Processual</title>
    <style>
      body {
        width: 420px;
        max-height: 560px;
        overflow-y: auto;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #1f2937;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4b5563;
        margin: 14px 0 6px;
      }
      .secao {
        border-top: 1px solid #e5e7eb;
        padding-top: 8px;
        margin-top: 8px;
      }
      .campo {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .campo input {
        padding: 4px 6px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font: inherit;
      }
      .caixa {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .parte {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px;
        margin-bottom: 6px;
      }
      .linha {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .linha .campo {
        flex: 1;
        margin-bottom: 0;
      }
      .nome-anexo {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        cursor: pointer;
        border: 1px solid #d1d5db;
        background: #f9fafb;
        border-radius: 4px;
        padding: 5px 8px;
        font: inherit;
      }
      button.primario {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
        width: 100%;
        padding: 8px;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #pendencias {
        font-size: 12px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      #pendencias.vazio {
        display: none;
      }
      #status {
        font-size: 12px;
        margin-top: 8px;
        min-height: 16px;
      }
      #aviso-protocolo {
        font-size: 11px;
        color: #6b7280;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Distribuição Processual</h1>
    <input id="arquivo-peticao" type="file" accept="application/pdf,image/png,image/jpeg" />
    <div id="anexos-extra">
      <input id="arquivo-anexos" type="file" accept="application/pdf,image/png,image/jpeg" multiple />
    </div>
    <div id="status"></div>
    <div id="pendencias" class="vazio"></div>
    <div id="checklist"></div>
    <select id="seletor-tribunal">
      <option value="pje">PJe</option>
      <option value="esaj">e-SAJ</option>
      <option value="eproc">eproc</option>
    </select>
    <button id="botao-preencher" class="primario" disabled>Preencher na aba ativa</button>
    <p id="aviso-protocolo">
      A extensão preenche até a tela final de revisão do tribunal. Protocolar é sempre um clique seu, na aba do tribunal.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
